function renderDictation(){let items=dictItems(),done=dictIndex>=items.length;return `<div class="layout"><section class="panel"><div class="panel-top"><h2>听写练习 <span class="small">/ DIKTAT</span></h2></div>${done?`<div class="success"><div class="big-check">✓</div><h2>听写完成！</h2><p>首次作答正确 ${dictScore} / ${dictDone}</p>${button('重新练习','dict-restart','primary')}</div>`:`<div class="listen-area"><button class="listen-big" data-action="dict-audio" aria-label="播放听写">♫</button><p>第 ${dictIndex+1} ${dictType==='sentence'?'句':'个单词'} · 点击播放，可反复听</p>${button('0.65× 慢速播放','dict-slow','audio-btn')}</div><form id="dict-form"><label class="input-label" for="answer">你听到了什么？</label><input class="answer-input" id="answer" lang="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入德语…"><div class="chars">${['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>`<button type="button" data-char="${c}">${c}</button>`).join('')}</div><div id="dict-feedback" class="feedback" role="status"></div><div class="actions"><button class="primary" type="submit" id="check-answer">检查答案</button>${button('下一题','dict-next','secondary','type="button" disabled')}</div></form><p class="hint-text">标点和多余空格不计错；忽略大小写评分，但会提示书写差异。</p>${button('查看中文提示','dict-hint','text-link')}<p id="dict-hint" class="hint-text"></p>`}<div class="progress-track"><i style="width:${dictIndex/items.length*100}%"></i></div><div class="progress-label"><span>完成 ${dictIndex} / ${items.length}</span><span>首次正确 ${dictScore} 题</span></div></section><aside class="right-stack"><div class="panel"><h3>听写三步走</h3><ol class="mini-list"><li><span class="num">1</span>先听完整的一遍</li><li><span class="num">2</span>慢速重听，写出单词</li><li><span class="num">3</span>对照答案，再读一遍</li></ol></div>${tip('听不清，<br>再听一次就好。','ä、ö、ü 和 ß 都可以用输入框下方的按钮输入。单词听写请写出名词冠词。')}</aside></div>`}
function resetDialog(){stopRecognition();turn=0;chat=[];dialogFinished=false;showHelp=false;replyDraft='';replySubmitted=false;render()}
function renderDialog(){const s=scenes[sceneIndex],t=s.turns[turn];const bubbles=chat.map(x=>`<div class="bubble ${x.mine?'mine':''}"><div class="speaker">${x.mine?'你':esc(s.role)}</div><p lang="de">${esc(x.text)}</p>${x.zh?`<div class="translation">${esc(x.zh)}</div>`:''}</div>`).join('');return `<div class="layout"><section class="panel"><div class="panel-top"><h2>情景对话 <span class="small">/ SPRECHEN</span></h2><select id="scene" aria-label="对话情景">${scenes.map((x,i)=>`<option value="${i}" ${i===sceneIndex?'selected':''}>${x.title}</option>`).join('')}</select></div><p class="practice-label">${s.description} · 引导练习，非 AI 自由聊天</p><div class="chat" id="chat">${bubbles}${!dialogFinished?`<div class="bubble"><div class="speaker">${esc(s.role)} · 第 ${turn+1} / ${s.turns.length} 轮</div><p lang="de">${esc(t[0])}</p><div class="translation">${esc(t[1])}</div><button data-action="dialog-audio">♫ 听对方说</button></div>`:`<div class="success"><h2>你完成了一次对话！</h2><p class="review-note">试着再来一次，少看一点提示。</p>${button('再练一遍','dialog-restart','primary')}</div>`}</div>${!dialogFinished?`<div class="dialog-controls"><div class="practice-label">轮到你了 · 可以跟读示例，也可以填写自己的回答</div>${button(showHelp?'收起参考回答':'看看怎么回答','dialog-help','text-link')}${showHelp?`<div class="feedback"><span lang="de">${esc(t[2])}</span><br>${esc(t[3])}<br>${button('♫ 听参考回答','sample-audio','text-link')}</div>`:''}<form id="dialog-form"><label for="reply" class="input-label" style="margin-top:15px">你的德语回答</label><input id="reply" class="answer-input" lang="de" autocomplete="off" placeholder="说出来，或在这里输入…"><div class="row">${button('♩ 语音输入','record','secondary','type="button"')}<button type="submit" class="primary">提交回答</button></div></form><div id="dialog-feedback" class="feedback" role="status"></div><div class="row" id="dialog-next" hidden></div><p class="help-line">语音输入需要麦克风权限和浏览器支持，识别可能由浏览器语音服务处理。文字匹配仅检查练习句式，不评估发音。</p></div>`:''}</section><aside class="right-stack"><div class="panel"><h3>从生活里的四句话开始</h3>${scenes.map((x,i)=>`<div class="list-topic"><span class="topic-title"><i class="topic-dot"></i>${x.title}</span><span class="small">4 轮</span></div>`).join('')}</div>${tip('先开口，<br>再慢慢说好。','不用一次说得完美。先听示例，跟读，再试着替换成自己的名字和城市。')}</aside></div>`}
function gradeDictation(restoring=false){if(checked&&!restoring)return;let a=$('#answer').value.trim();if(!a){notify('先输入你听到的内容。');return}const expected=dictItems()[dictIndex][0],ok=normalize(a)===normalize(expected);if(!restoring){dictDone++;if(ok)dictScore++;}checked=true;dictDraft=a;const el=$('#dict-feedback');el.className='feedback'+(ok?'':' wrong');el.textContent=(ok?'✓ 答对了！':'再对照看看：')+'\n'+expected+'\n'+dictItems()[dictIndex][1]+(ok&&a!==expected?'\n注意标准写法中的大小写和标点。':'');$('#answer').readOnly=true;$('#check-answer').disabled=true;const nextButton=$('[data-action="dict-next"]');nextButton.disabled=false;nextButton.classList.add('dict-next-ready');nextButton.classList.toggle('dict-next-correct',ok);if(!restoring)scheduleSave();}
function acceptReply(){let input=$('#reply'),value=input.value.trim();if(!value){notify('先说一句或输入你的回答。');return}stopRecognition();replyDraft=value;replySubmitted=true;scheduleSave();const t=scenes[sceneIndex].turns[turn],ok=normalize(value).includes(normalize(t[4]));const el=$('#dialog-feedback');el.className='feedback'+(ok?'':' wrong');el.textContent=ok?'✓ 用到了本轮的练习句式。也可以听听参考回答，比较一下。':'已收到你的回答。参考句式：'+t[2]+'\n本练习只做关键词匹配，其他表达也可能正确。';const next=$('#dialog-next');next.hidden=false;next.innerHTML=button('听参考回答','sample-audio')+button(turn===scenes[sceneIndex].turns.length-1?'完成对话':'继续下一轮','dialog-next','primary');next.querySelector('[data-action="sample-audio"]').onclick=()=>speak(t[2]);next.querySelector('[data-action="dialog-next"]').onclick=()=>{chat.push({text:t[0],zh:t[1]},{text:value,mine:true});turn++;dialogFinished=turn>=scenes[sceneIndex].turns.length;showHelp=false;replyDraft='';replySubmitted=false;render();$('#chat')?.scrollTo(0,$('#chat').scrollHeight)};}
function stopRecognition(){if(recognition){recognition.abort();recognition=null}recognizing=false}
function startRecognition(){if(recognizing){stopRecognition();const b=$('[data-action="record"]');if(b){b.textContent='♩ 语音输入';b.classList.remove('recording')}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('当前浏览器不支持语音识别。可以使用 Chrome，或直接打字练习。');return}if('speechSynthesis'in window)speechSynthesis.cancel();const r=new SR();recognition=r;r.lang='de-DE';r.interimResults=false;r.continuous=false;r.onstart=()=>{recognizing=true;const b=$('[data-action="record"]');if(b){b.textContent='正在听… 点击停止';b.classList.add('recording')}};r.onresult=e=>{if(mode==='dialog'&&$('#reply')){$('#reply').value=e.results[0][0].transcript;replyDraft=$('#reply').value;replySubmitted=false;scheduleSave();notify('已转成文字，检查后点击提交回答。')}};r.onerror=e=>{if(e.error==='aborted')return;notify(e.error==='not-allowed'?'麦克风权限未开启，可以允许后重试，或打字练习。':e.error==='no-speech'?'没有听到声音，请再试一次。':'语音识别暂时不可用，请打字继续练习。')};r.onend=()=>{recognizing=false;recognition=null;const b=$('[data-action="record"]');if(b){b.textContent='♩ 语音输入';b.classList.remove('recording')}};try{r.start()}catch{stopRecognition();notify('无法启动语音识别，请打字继续。')}}
function setTopic(value){topic=value;queue=studyOrder.filter(id=>topic<0||words[id].topic===topic);pos=0;flipped=false;render()}
function action(a){const w=words[queue[pos]];switch(a){case'flip':{flipped=!flipped;const inner=$('.card-inner'),front=$('.card-face-front'),back=$('.card-face-back');if(inner){inner.classList.toggle('is-flipped',flipped);front?.setAttribute('aria-hidden',String(flipped));back?.setAttribute('aria-hidden',String(!flipped));$('.card-front')?.setAttribute('aria-label','点击卡片翻面看释义；左滑不认识，下滑模糊，右滑认识')}scheduleSave();break;}case'word-audio':speak(w.de);break;case'example-audio':speak(w.example);break;case'known':known.add(w.id);again.delete(w.id);fuzzy.delete(w.id);pos++;flipped=false;render();break;case'again':again.add(w.id);known.delete(w.id);fuzzy.delete(w.id);pos++;flipped=false;render();break;case'blur':fuzzy.add(w.id);known.delete(w.id);again.delete(w.id);pos++;flipped=false;render();break;case'restart':setTopic(topic);break;case'review':queue=studyOrder.filter(id=>again.has(id)&&(topic<0||words[id].topic===topic));if(!queue.length){notify('当前主题没有待复习单词。');setTopic(topic)}else{pos=0;flipped=false;render()}break;case'dict-audio':speak(dictItems()[dictIndex][0],0.85);break;case'dict-slow':speak(dictItems()[dictIndex][0],0.65);break;case'dict-hint':dictHint=true;$('#dict-hint').textContent=dictItems()[dictIndex][1];scheduleSave();break;case'dict-next':dictIndex++;checked=false;dictDraft='';dictHint=false;render();break;case'dict-restart':dictIndex=0;dictScore=0;dictDone=0;checked=false;dictDraft='';dictHint=false;render();break;case'dialog-audio':speak(scenes[sceneIndex].turns[turn][0]);break;case'sample-audio':speak(scenes[sceneIndex].turns[turn][2]);break;case'dialog-help':{const val=$('#reply')?.value;showHelp=!showHelp;render();if($('#reply'))$('#reply').value=val||'';break}case'dialog-restart':resetDialog();break;case'record':startRecognition();break;}}
function bindCardSwipe(){
 const card=$('.card-front');if(!card)return;
 const stack=card.closest('.card-stack'),back=stack?.querySelector('.card-back');
 card.style.touchAction='none';
 const drag=(x,y)=>{const dx=x-swipeStart.x,dy=y-swipeStart.y;card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;if(back){const reveal=Math.min(Math.hypot(dx,dy)/220,1);back.style.transform=`translateY(${10*(1-reveal)}px) scale(${.94+.06*reveal})`;back.style.boxShadow=`0 ${4+12*reveal}px ${14+22*reveal}px rgba(27,41,64,${.08+.12*reveal})`}card.querySelector('.swipe-left').style.opacity=String(Math.min(Math.max(-dx/90,0),1));card.querySelector('.swipe-right').style.opacity=String(Math.min(Math.max(dx/90,0),1));card.querySelector('.swipe-down').style.opacity=String(Math.min(Math.max(dy/90,0),1))};
 const reset=()=>{card.style.transition='';card.style.transform='';card.style.opacity='';if(back){back.style.transition='';back.style.transform='';back.style.boxShadow=''}card.querySelectorAll('.swipe-cue').forEach(c=>c.style.opacity='0')};
 const finish=e=>{if(!swipeStart||swipeStart.id!==e.pointerId)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;let nextAction='',cue='';if(Math.abs(dx)>=72&&Math.abs(dx)>Math.abs(dy)){nextAction=dx<0?'again':'known';cue=dx<0?'.swipe-left':'.swipe-right'}else if(dy>=72&&dy>Math.abs(dx)){nextAction='blur';cue='.swipe-down'}if(nextAction){e.preventDefault();swipeSuppressUntil=Date.now()+420;card.style.transition='transform 330ms cubic-bezier(.22,.72,.26,1), opacity 330ms ease';card.querySelectorAll('.swipe-cue').forEach(c=>c.style.opacity='0');card.querySelector(cue).style.opacity='1';const distance=Math.max(window.innerWidth,window.innerHeight)*1.5;const flyX=nextAction==='again'?-distance:nextAction==='known'?distance:dx;const flyY=nextAction==='blur'?distance:dy;card.style.transform=`translate(${flyX}px,${flyY}px) rotate(${nextAction==='again'?-22:nextAction==='known'?22:0}deg)`;card.style.opacity='0';if(back){back.style.transition='transform 330ms cubic-bezier(.18,.72,.22,1), box-shadow 330ms ease';back.style.transform='translateY(0) scale(1)';back.style.boxShadow='0 18px 38px rgba(27,41,64,.2)'}setTimeout(()=>{swipeSuppressUntil=0;action(nextAction)},330);return}reset()};
 card.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||(e.button!==undefined&&e.button!==0))return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};card.setPointerCapture?.(e.pointerId);card.style.transition='none';e.preventDefault()});
 card.addEventListener('pointermove',e=>{if(!swipeStart||swipeStart.id!==e.pointerId)return;drag(e.clientX,e.clientY)});
 card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',()=>{swipeStart=null;reset()});
 card.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY,id:'touch'};card.style.transition='none'},{passive:true});
 card.addEventListener('touchmove',e=>{if(!swipeStart||swipeStart.id!=='touch'||e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];drag(t.clientX,t.clientY)},{passive:false});
 card.addEventListener('touchend',e=>{if(!swipeStart||swipeStart.id!=='touch')return;const t=e.changedTouches[0];finish({pointerId:'touch',clientX:t.clientX,clientY:t.clientY,preventDefault(){}})},{passive:false});
 card.addEventListener('touchcancel',()=>{swipeStart=null;reset()},{passive:true});
}

function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.classList.contains('card')&&Date.now()<swipeSuppressUntil)return;action(b.dataset.action)});bindCardSwipe();$('#topic')?.addEventListener('change',e=>setTopic(Number(e.target.value)));$('#dict-type')?.addEventListener('change',e=>{dictType=e.target.value;dictIndex=0;dictDone=0;dictScore=0;checked=false;dictDraft='';dictHint=false;render()});$('#scene')?.addEventListener('change',e=>{sceneIndex=Number(e.target.value);resetDialog()});$('#dict-form')?.addEventListener('submit',e=>{e.preventDefault();gradeDictation()});$('#dialog-form')?.addEventListener('submit',e=>{e.preventDefault();acceptReply()});document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{const input=$('#answer');if(input.readOnly)return;const start=input.selectionStart,end=input.selectionEnd;input.setRangeText(b.dataset.char,start,end,'end');dictDraft=input.value;scheduleSave();input.focus()})}

const PROGRESS_FIELDS=['mode','topic','queue','pos','flipped','known','again','fuzzy','dictIndex','dictType','checked','dictScore','dictDone','sceneIndex','turn','chat','dialogFinished','showHelp','dictDraft','replyDraft','replySubmitted','dictHint'];
const STORAGE_KEY='schritt-learning-progress-v1';
let progressReady=false,lastSaved='',lastPersisted=null,saveBlocked=false;
function snapshot(){return {version:1,orderVersion:1,mode,topic,queue,pos,flipped,known:[...known],again:[...again],fuzzy:[...fuzzy],dictIndex,dictType,checked,dictScore,dictDone,sceneIndex,turn,chat,dialogFinished,showHelp,dictDraft,replyDraft,replySubmitted,dictHint};}
function loadSnapshot(s){
 const integer=(n,min,max)=>Number.isInteger(n)&&n>=min&&n<=max;
 const ids=a=>Array.isArray(a)&&a.length<=words.length&&a.every(n=>integer(n,0,words.length-1))&&new Set(a).size===a.length;
 if(!s||s.version!==1||s.orderVersion!==undefined&&s.orderVersion!==1||!['cards','dictation','dialog'].includes(s.mode)||!integer(s.topic,-1,topics.length-1)||!ids(s.queue)||!s.queue.length||!integer(s.pos,0,s.queue.length)||!ids(s.known)||!ids(s.again)||!ids(s.fuzzy||[])||s.known.some(id=>s.again.includes(id)||s.fuzzy?.includes(id))||s.again.some(id=>s.fuzzy?.includes(id))||!['sentence','word'].includes(s.dictType)||!integer(s.dictIndex,0,s.dictType==='word'?words.length:sentences.length)||!integer(s.dictDone,0,s.dictType==='word'?words.length:sentences.length)||!integer(s.dictScore,0,s.dictDone)||!integer(s.sceneIndex,0,scenes.length-1)||!integer(s.turn,0,scenes[s.sceneIndex].turns.length)||!Array.isArray(s.chat)||s.chat.length!==s.turn*2||s.chat.some(x=>!x||typeof x.text!=='string'||x.text.length>2000||x.zh!==undefined&&typeof x.zh!=='string')||typeof s.dictDraft!=='string'||s.dictDraft.length>2000||typeof s.replyDraft!=='string'||s.replyDraft.length>2000)throw Error('保存的进度格式无法读取，请保留此页面并联系维护者。');
 if(['flipped','checked','dialogFinished','showHelp','replySubmitted','dictHint'].some(k=>typeof s[k]!=='boolean')||s.dialogFinished!==(s.turn===scenes[s.sceneIndex].turns.length)||s.checked&&(!s.dictDraft||s.dictIndex>=(s.dictType==='word'?words.length:sentences.length))||s.replySubmitted&&!s.replyDraft)throw Error('保存的进度状态不一致，请联系维护者。');
 ({mode,topic,queue,pos,flipped,dictIndex,dictType,checked,dictScore,dictDone,sceneIndex,turn,chat,dialogFinished,showHelp,dictDraft,replyDraft,replySubmitted,dictHint}=s);if(s.orderVersion!==1){const remaining=s.queue.slice(s.pos);const wasOriginalFullQueue=s.topic===-1&&s.queue.length===48&&s.queue.every((id,i)=>id===i)&&s.again.length!==48;if(wasOriginalFullQueue)remaining.push(...studyOrder.filter(id=>id>=48));remaining.sort((a,b)=>words[a].topic-words[b].topic||a-b);queue=remaining;pos=0;}known=new Set(s.known);again=new Set(s.again);fuzzy=new Set(s.fuzzy||[]);if(dictType==='sentence'){try{localStorage.setItem(STORAGE_KEY+'-sentence-backup',JSON.stringify(s))}catch{}dictType='word';dictIndex=0;checked=false;dictScore=0;dictDone=0;dictDraft='';dictHint=false;}
}
function saveStatus(message,failed=false){const e=$('#save-status');if(e){e.textContent=message;e.classList.toggle('save-error',failed)}const retry=$('#retry-save');if(retry)retry.hidden=!failed;}
function restoreInputs(){
 if(mode==='dictation'&&$('#answer')){$('#answer').value=dictDraft;$('#answer').maxLength=2000;$('#answer').addEventListener('input',()=>{dictDraft=$('#answer').value;scheduleSave()});if(checked)gradeDictation(true);if(dictHint)$('#dict-hint').textContent=dictItems()[dictIndex][1];}
 if(mode==='dialog'&&$('#reply')){$('#reply').value=replyDraft;$('#reply').maxLength=2000;$('#reply').addEventListener('input',()=>{replyDraft=$('#reply').value;replySubmitted=false;$('#dialog-next').hidden=true;$('#dialog-feedback').textContent='';scheduleSave()});if(replySubmitted)acceptReply();}
}
function scheduleSave(){if(progressReady&&!saveBlocked)flushProgress();}
function flushProgress(){
 if(!progressReady||saveBlocked)return;
 const payload=JSON.stringify(snapshot());if(payload===lastSaved)return;
 try{
  if(localStorage.getItem(STORAGE_KEY)!==lastPersisted){saveBlocked=true;$('#retry-save').textContent='载入最新进度';throw Error('其他页面已更新进度，请载入最新进度后继续。');}
  localStorage.setItem(STORAGE_KEY,payload);lastPersisted=payload;lastSaved=payload;saveStatus('进度已保存到此浏览器');
 }catch(e){saveStatus(saveBlocked?e.message:'此浏览器暂时无法保存进度，请检查存储设置后重试。',true);}
}
function initializeProgress(){
 progressReady=false;$('#app').inert=true;document.querySelector('nav').inert=true;
 try{
  const raw=localStorage.getItem(STORAGE_KEY);if(raw)loadSnapshot(JSON.parse(raw));
  lastPersisted=raw;lastSaved=raw||'';saveBlocked=false;render();progressReady=true;$('#app').inert=false;document.querySelector('nav').inert=false;
  $('#retry-save').textContent='重试保存';saveStatus(raw?'已恢复上次进度 · 自动保存已开启':'自动保存已开启');flushProgress();
 }catch(e){
  if(e instanceof SyntaxError||String(e.message).includes('保存的进度')){saveStatus('保存的进度无法读取，请保留浏览器数据并联系维护者。',true);$('#app').innerHTML='<div class="panel"><h2>暂时无法恢复进度</h2><p>已有记录已保留，没有被覆盖。请点击重试，或联系维护者。</p></div>';$('#retry-save').textContent='重试';}
  else{render();progressReady=true;$('#app').inert=false;document.querySelector('nav').inert=false;saveStatus('浏览器存储不可用，可以练习，但关闭后可能丢失进度。',true);}
 }
}
$('#retry-save').onclick=()=>{if(!progressReady)initializeProgress();else if(saveBlocked){if(confirm('载入其他页面保存的最新进度？本页未保存的操作将被替换。'))location.reload();}else flushProgress();};
window.addEventListener('pagehide',flushProgress);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushProgress();});
window.addEventListener('storage',e=>{if((e.key===STORAGE_KEY||e.key===null)&&progressReady){saveBlocked=true;$('#retry-save').textContent='载入最新进度';saveStatus('其他页面已更新进度，请载入最新进度后继续。',true);}});

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));initializeProgress();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'open_learning_module',title:'打开德语学习模块',description:'切换可见的单词记忆、听写或情景对话模块，不提交答案。',inputSchema:{type:'object',properties:{module:{type:'string',enum:['cards','dictation','dialog']}},required:['module'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!['cards','dictation','dialog'].includes(input.module))throw Error('module 必须为 cards、dictation 或 dialog');switchMode(input.module);return{module:mode,title:$('#crumb').textContent}}})).catch(()=>{})}catch{}}
